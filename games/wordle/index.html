<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Play Wordle Clone — guess the 5-letter word in 6 tries! Part of GameBox.">
    <meta name="theme-color" content="#0f1117">
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../common.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../code-panel.css">
    <title>Wordle — GameBox</title>
</head>
<body>
    <a href="#game" class="skip-link">Skip to game</a>
    <a href="../" class="back-link" aria-label="Back to GameBox hub">← Back to GameBox</a>
    <div class="game-shell wordle-shell" id="game">
        <h1>Wordle</h1>
        <div class="wordle-board" id="board"></div>
        <p class="gb-status" id="message">&nbsp;</p>
        <div class="wordle-keyboard" id="keyboard"></div>
        <button class="gb-btn gb-btn-solid" id="new-game-btn">New Word</button>
    </div>
    <script src="script.js"></script>
    <script src="../code-panel.js"></script>
</body>
</html>
