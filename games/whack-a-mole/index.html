<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Play Whack-a-Mole — test your reflexes! Click the moles before they disappear.">
    <meta name="theme-color" content="#0f1117">
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../common.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../code-panel.css">
    <title>Whack-a-Mole — GameBox</title>
</head>
<body>
    <a href="../index.html" class="back-link">← Back to GameBox</a>
    <div class="game-shell wam-shell">
        <h1>Whack-a-Mole</h1>
        <p id="status" class="gb-status">Score: <span id="score">0</span> | ⏱ <span id="timer">30</span>s</p>
        <div id="mole-grid" class="mole-grid"></div>
        <button id="start-btn" class="gb-btn-solid mt-2">Start Game</button>
        <div class="gb-scoreboard mt-1">
            <p>Best: <span id="best">0</span></p>
        </div>
    </div>
    <script src="script.js"></script>
    <script src="../code-panel.js"></script>
</body>
</html>
