<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Play Rock Paper Scissors against the computer. The timeless hand game — now in your browser.">
    <meta name="theme-color" content="#0f1117">
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../common.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../code-panel.css">
    <title>Rock, Paper, Scissors — GameBox</title>
</head>
<body>
    <a href="../index.html" class="back-link">← Back to GameBox</a>
    <div class="game-shell">
        <h1>Rock, Paper, Scissors</h1>
        <div class="rps-arena">
            <div id="player-choice" class="rps-column">
                <h2>Your Move</h2>
                <button data-choice="rock" class="gb-btn-solid rps-btn">✊ Rock</button>
                <button data-choice="paper" class="gb-btn-solid rps-btn">✋ Paper</button>
                <button data-choice="scissors" class="gb-btn-solid rps-btn">✌️ Scissors</button>
            </div>
            <div id="computer-choice" class="rps-column">
                <h2>Computer</h2>
                <div id="computer-move" class="rps-display">?</div>
            </div>
        </div>
        <p id="result" class="gb-status mt-2"></p>
        <div id="scoreboard" class="gb-scoreboard">
            <p>Wins: <span id="wins">0</span></p>
            <p>Losses: <span id="losses">0</span></p>
            <p>Draws: <span id="draws">0</span></p>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="../code-panel.js"></script>
</body>
</html>
