<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Play BlackJack — try to get as close to 21 as possible without going over. A classic card game.">
    <meta name="theme-color" content="#0f1117">
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../common.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="../code-panel.css">
    <title>BlackJack — GameBox</title>
</head>

<body>
    <a href="../index.html" class="back-link">← Back to GameBox</a>

    <div class="game-shell">
        <h1>BlackJack</h1>

        <p id="message-El" class="gb-status">Want to play?</p>
        <p id="cards-El" class="bj-cards">Cards: </p>
        <p id="sum-El" class="bj-sum">Sum: </p>

        <div class="bj-actions">
            <button class="gb-btn-solid" id="play-btn" onclick="startGame()">Play</button>
            <button class="gb-btn-solid" id="newCard-btn" onclick="newCard()">New Card</button>
            <button class="gb-btn" id="newGame-btn" onclick="newGame()">New Game</button>
        </div>
        <p id="result-El" class="gb-status mt-2"></p>
    </div>

    <!--script below-->
    <script src="script.js"></script>
    <script src="../code-panel.js"></script>
</body>

</html>
