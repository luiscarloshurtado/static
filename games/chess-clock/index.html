<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Chess Clock — dual timer for chess and board games! Part of GameBox.">
    <meta name="theme-color" content="#0f1117">
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../common.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../code-panel.css">
    <title>Chess Clock — GameBox</title>
</head>
<body>
    <a href="#game" class="skip-link">Skip to game</a>
    <a href="../" class="back-link" aria-label="Back to GameBox hub">← Back to GameBox</a>
    <div class="game-shell clock-shell" id="game">
        <h1>Chess Clock</h1>
        <div class="gb-selector" id="preset-selector" role="group" aria-label="Time preset">
            <button class="gb-btn" data-time="60">1 min</button>
            <button class="gb-btn" data-time="180">3 min</button>
            <button class="gb-btn active" data-time="300">5 min</button>
            <button class="gb-btn" data-time="600">10 min</button>
        </div>
        <div class="clock-container">
            <button class="clock-face" id="clock-1" aria-label="Player 1 clock">
                <span class="clock-label">Player 1</span>
                <span class="clock-time" id="time-1">5:00</span>
            </button>
            <button class="clock-face" id="clock-2" aria-label="Player 2 clock">
                <span class="clock-label">Player 2</span>
                <span class="clock-time" id="time-2">5:00</span>
            </button>
        </div>
        <div class="clock-controls">
            <button class="gb-btn" id="pause-btn">⏸ Pause</button>
            <button class="gb-btn gb-btn-solid" id="reset-btn">Reset</button>
        </div>
        <p class="gb-status" id="status">Tap a clock or press Space to start</p>
    </div>
    <script src="script.js"></script>
    <script src="../code-panel.js"></script>
</body>
</html>
