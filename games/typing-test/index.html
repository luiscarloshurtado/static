<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Typing Speed Test — measure your WPM and accuracy. Improve your typing skills.">
    <meta name="theme-color" content="#0f1117">
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../common.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../code-panel.css">
    <title>Typing Speed Test — GameBox</title>
</head>
<body>
    <a href="../index.html" class="back-link">← Back to GameBox</a>
    <div class="game-shell typing-shell">
        <h1>Typing Speed Test</h1>
        <div id="difficulty-selector" class="gb-selector">
            <button class="gb-btn active" data-time="30">30s</button>
            <button class="gb-btn" data-time="60">60s</button>
            <button class="gb-btn" data-time="120">2 min</button>
        </div>
        <div id="text-display" class="text-display"></div>
        <input type="text" id="input" class="typing-input" placeholder="Start typing..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <p id="stats" class="gb-status mt-1">WPM: — | Accuracy: — | ⏱ <span id="timer">30</span>s</p>
        <button id="restart-btn" class="gb-btn-solid mt-2">Restart</button>
        <div class="gb-scoreboard mt-1">
            <p>Best WPM: <span id="best">0</span></p>
        </div>
    </div>
    <script src="script.js"></script>
    <script src="../code-panel.js"></script>
</body>
</html>
